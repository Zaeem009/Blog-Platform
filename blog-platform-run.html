<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog Platform</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef } = React;

    const DB = {
      get: (k) => { try { return JSON.parse(localStorage.getItem(k)) || []; } catch { return []; } },
      set: (k, v) => localStorage.setItem(k, JSON.stringify(v)),
      getObj: (k) => { try { return JSON.parse(localStorage.getItem(k)) || null; } catch { return null; } },
    };

    const seed = () => {
      if (DB.get("bp_users").length) return;
      const users = [{ id: "u1", username: "alice", email: "alice@blog.com", password: "alice123", bio: "Writer & thinker.", avatar: "AL", joined: Date.now() - 86400000 * 30 }];
      const posts = [
        { id: "p1", authorId: "u1", title: "The Art of Slow Reading", slug: "art-of-slow-reading", excerpt: "In a world of endless scroll, reading slowly is a radical act.", body: "In a world of endless scroll, reading slowly is a radical act.\n\nWe skim headlines, swipe through feeds, and mistake information intake for understanding. But true comprehension — the kind that rewires how you think — requires friction. It demands you sit with a sentence, reread a paragraph, let an idea settle.\n\nSlow reading is not inefficiency. It's a different kind of productivity: the kind that builds lasting knowledge rather than temporary familiarity. Pick up a book today. Read one page with full attention. See what you find.", tag: "Culture", createdAt: Date.now() - 86400000 * 10, likes: ["u1"] },
        { id: "p2", authorId: "u1", title: "Why Simplicity Is Hard", slug: "why-simplicity-is-hard", excerpt: "Simple things are often the result of immense complexity, carefully hidden.", body: "Simple things are often the result of immense complexity, carefully hidden.\n\nA great product that 'just works' took thousands of decisions — what to remove, what to defer, what to never build at all. A clear sentence took drafts, rewrites, deletions.\n\nSimplicity is not the absence of effort. It's the absence of waste. And knowing what counts as waste? That's the hardest part.\n\nThe next time something feels effortless to use, consider the effort that went into that effortlessness. Someone spent enormous care making it disappear.", tag: "Design", createdAt: Date.now() - 86400000 * 5, likes: [] },
      ];
      const comments = [
        { id: "c1", postId: "p1", authorId: "u1", body: "This resonated deeply. I've been trying to read one book at a time, no multitasking. Already noticing the difference.", createdAt: Date.now() - 86400000 * 2 },
      ];
      DB.set("bp_users", users);
      DB.set("bp_posts", posts);
      DB.set("bp_comments", comments);
    };

    const genId = () => Math.random().toString(36).slice(2, 10);
    const slugify = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    const timeAgo = (ts) => {
      const diff = (Date.now() - ts) / 1000;
      if (diff < 60) return "just now";
      if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
      if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
      return `${Math.floor(diff / 86400)}d ago`;
    };
    const TAGS = ["Culture", "Design", "Tech", "Life", "Science", "Art", "Business"];

    const css = `
      @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap');
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --ink: #1a1814;
        --ink2: #4a4640;
        --ink3: #8a8680;
        --paper: #faf9f7;
        --paper2: #f2f0ec;
        --paper3: #e8e5df;
        --accent: #c8622a;
        --accent2: #e8834a;
        --border: rgba(26,24,20,0.12);
        --radius: 12px;
        --serif: 'Lora', Georgia, serif;
        --sans: 'DM Sans', system-ui, sans-serif;
      }
      body { background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.6; }
      button { cursor: pointer; border: none; background: none; font-family: var(--sans); font-size: 14px; }
      input, textarea { font-family: var(--sans); font-size: 15px; }
      a { color: inherit; text-decoration: none; }

      .nav { position: sticky; top: 0; z-index: 100; background: rgba(250,249,247,0.92); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 0 2rem; display: flex; align-items: center; justify-content: space-between; height: 58px; }
      .nav-logo { font-family: var(--serif); font-size: 20px; font-weight: 600; color: var(--ink); letter-spacing: -0.3px; }
      .nav-logo span { color: var(--accent); }
      .nav-actions { display: flex; align-items: center; gap: 10px; }
      .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; font-size: 14px; font-weight: 500; transition: all 0.15s; }
      .btn-ghost { color: var(--ink2); }
      .btn-ghost:hover { background: var(--paper2); color: var(--ink); }
      .btn-primary { background: var(--accent); color: #fff; }
      .btn-primary:hover { background: var(--accent2); }
      .btn-outline { border: 1px solid var(--border); color: var(--ink2); }
      .btn-outline:hover { background: var(--paper2); border-color: var(--ink3); }
      .btn-danger { color: #b91c1c; }
      .btn-danger:hover { background: #fef2f2; }
      .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; flex-shrink: 0; }

      .container { max-width: 900px; margin: 0 auto; padding: 0 2rem; }
      .page { min-height: calc(100vh - 58px); padding: 3rem 0 6rem; }
      .hero { text-align: center; padding: 5rem 2rem 4rem; max-width: 680px; margin: 0 auto; }
      .hero h1 { font-family: var(--serif); font-size: clamp(2.2rem, 5vw, 3.5rem); font-weight: 600; line-height: 1.15; letter-spacing: -0.5px; margin-bottom: 1rem; }
      .hero p { font-size: 17px; color: var(--ink2); line-height: 1.7; margin-bottom: 2rem; }
      .hero-cta { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
      .feed { display: grid; gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
      .post-row { background: var(--paper); padding: 1.5rem 2rem; transition: background 0.12s; cursor: pointer; }
      .post-row:hover { background: var(--paper2); }
      .post-row-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
      .post-row-meta .avatar { width: 24px; height: 24px; font-size: 10px; }
      .post-row-meta span { font-size: 13px; color: var(--ink3); }
      .post-tag { font-size: 11px; font-weight: 500; padding: 3px 8px; border-radius: 20px; background: var(--paper3); color: var(--ink2); letter-spacing: 0.03em; }
      .post-row h2 { font-family: var(--serif); font-size: 1.2rem; font-weight: 600; line-height: 1.3; margin-bottom: 6px; }
      .post-row p { font-size: 14px; color: var(--ink2); line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 12px; }
      .post-row-footer { display: flex; align-items: center; justify-content: space-between; }
      .post-stats { display: flex; gap: 14px; }
      .post-stat { font-size: 13px; color: var(--ink3); display: flex; align-items: center; gap: 4px; }
      .post-detail { max-width: 680px; margin: 0 auto; padding: 3rem 2rem 6rem; }
      .post-detail-tag { display: inline-block; font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 20px; background: var(--paper3); color: var(--ink2); margin-bottom: 1.25rem; }
      .post-detail h1 { font-family: var(--serif); font-size: clamp(1.8rem, 4vw, 2.6rem); font-weight: 600; line-height: 1.2; letter-spacing: -0.3px; margin-bottom: 1.25rem; }
      .post-detail-byline { display: flex; align-items: center; gap: 10px; margin-bottom: 2.5rem; padding-bottom: 2rem; border-bottom: 1px solid var(--border); }
      .post-detail-byline strong { font-size: 14px; font-weight: 500; }
      .post-detail-byline span { font-size: 13px; color: var(--ink3); }
      .post-body { font-family: var(--serif); font-size: 17px; line-height: 1.85; color: var(--ink); white-space: pre-wrap; }
      .post-actions { display: flex; align-items: center; gap: 12px; margin-top: 2.5rem; padding-top: 2rem; border-top: 1px solid var(--border); }
      .like-btn { display: flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); font-size: 14px; font-weight: 500; color: var(--ink2); transition: all 0.15s; }
      .like-btn:hover { border-color: var(--accent); color: var(--accent); background: #fff5f0; }
      .like-btn.liked { background: #fff5f0; border-color: var(--accent); color: var(--accent); }
      .comments { margin-top: 3rem; }
      .comments h3 { font-family: var(--serif); font-size: 1.1rem; font-weight: 600; margin-bottom: 1.5rem; }
      .comment { padding: 1.25rem 0; border-top: 1px solid var(--border); }
      .comment-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
      .comment-author { font-size: 14px; font-weight: 500; }
      .comment-time { font-size: 12px; color: var(--ink3); }
      .comment-body { font-size: 15px; color: var(--ink2); line-height: 1.65; }
      .comment-form { margin-top: 1.5rem; }
      .textarea { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--paper); resize: vertical; min-height: 90px; font-size: 15px; color: var(--ink); outline: none; transition: border-color 0.15s; }
      .textarea:focus { border-color: var(--accent); }
      .form-page { max-width: 480px; margin: 0 auto; padding: 4rem 2rem; }
      .form-title { font-family: var(--serif); font-size: 1.9rem; font-weight: 600; margin-bottom: 0.5rem; }
      .form-sub { font-size: 14px; color: var(--ink3); margin-bottom: 2rem; }
      .form-group { margin-bottom: 1.25rem; }
      .form-label { display: block; font-size: 13px; font-weight: 500; color: var(--ink2); margin-bottom: 6px; }
      .form-input { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 9px; background: var(--paper); color: var(--ink); outline: none; transition: border-color 0.15s; }
      .form-input:focus { border-color: var(--accent); }
      .form-select { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 9px; background: var(--paper); color: var(--ink); outline: none; appearance: none; }
      .form-error { font-size: 13px; color: #b91c1c; margin-top: 8px; padding: 10px 14px; background: #fef2f2; border-radius: 8px; }
      .form-switch { font-size: 14px; color: var(--ink3); margin-top: 1.25rem; text-align: center; }
      .form-switch button { color: var(--accent); font-weight: 500; padding: 0; font-size: 14px; }
      .editor-page { max-width: 720px; margin: 0 auto; padding: 3rem 2rem; }
      .editor-page h2 { font-family: var(--serif); font-size: 1.6rem; font-weight: 600; margin-bottom: 2rem; }
      .title-input { width: 100%; padding: 12px 0; border: none; border-bottom: 2px solid var(--border); background: transparent; font-family: var(--serif); font-size: 1.6rem; font-weight: 600; color: var(--ink); outline: none; margin-bottom: 1.5rem; }
      .title-input:focus { border-bottom-color: var(--accent); }
      .body-input { width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--paper); min-height: 280px; font-size: 16px; line-height: 1.75; color: var(--ink); outline: none; resize: vertical; }
      .body-input:focus { border-color: var(--accent); }
      .editor-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 1.5rem; flex-wrap: wrap; gap: 12px; }
      .profile-page { max-width: 800px; margin: 0 auto; padding: 3rem 2rem; }
      .profile-header { display: flex; align-items: center; gap: 1.5rem; margin-bottom: 3rem; padding-bottom: 2rem; border-bottom: 1px solid var(--border); }
      .profile-avatar { width: 72px; height: 72px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 600; flex-shrink: 0; }
      .profile-name { font-family: var(--serif); font-size: 1.5rem; font-weight: 600; }
      .profile-bio { font-size: 14px; color: var(--ink2); margin-top: 4px; }
      .profile-joined { font-size: 13px; color: var(--ink3); margin-top: 4px; }
      .section-title { font-family: var(--serif); font-size: 1.1rem; font-weight: 600; margin-bottom: 1.25rem; }
      .empty { text-align: center; padding: 4rem 2rem; color: var(--ink3); }
      .empty-icon { font-size: 2.5rem; margin-bottom: 1rem; }
      .empty p { font-size: 15px; }
      .back-btn { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--ink3); margin-bottom: 2rem; transition: color 0.12s; }
      .back-btn:hover { color: var(--ink); }
      .dropdown { position: relative; }
      .dropdown-menu { position: absolute; right: 0; top: calc(100% + 8px); background: var(--paper); border: 1px solid var(--border); border-radius: 10px; min-width: 160px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); z-index: 200; overflow: hidden; }
      .dropdown-item { display: block; width: 100%; padding: 10px 16px; text-align: left; font-size: 14px; color: var(--ink); transition: background 0.1s; }
      .dropdown-item:hover { background: var(--paper2); }
      .dropdown-divider { height: 1px; background: var(--border); }
      .toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 20px; border-radius: 8px; font-size: 14px; z-index: 999; animation: toastIn 0.2s ease; }
      @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(8px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
      .divider { height: 1px; background: var(--border); margin: 2rem 0; }
      .flex-center { display: flex; align-items: center; justify-content: center; }
      .tags-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 2rem; }
      .filter-tag { padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 500; border: 1px solid var(--border); color: var(--ink2); background: var(--paper); cursor: pointer; transition: all 0.12s; }
      .filter-tag:hover, .filter-tag.active { background: var(--accent); color: #fff; border-color: var(--accent); }
      .edit-delete { display: flex; gap: 8px; margin-left: auto; }
    `;

    function App() {
      useEffect(() => { seed(); }, []);

      const [page, setPage] = useState("home");
      const [currentUser, setCurrentUser] = useState(() => DB.getObj("bp_session"));
      const [posts, setPosts] = useState(() => DB.get("bp_posts").sort((a, b) => b.createdAt - a.createdAt));
      const [users, setUsers] = useState(() => DB.get("bp_users"));
      const [comments, setComments] = useState(() => DB.get("bp_comments"));
      const [selectedPost, setSelectedPost] = useState(null);
      const [editingPost, setEditingPost] = useState(null);
      const [filterTag, setFilterTag] = useState("All");
      const [toast, setToast] = useState(null);
      const [dropdownOpen, setDropdownOpen] = useState(false);
      const dropRef = useRef();

      const refresh = () => {
        setPosts(DB.get("bp_posts").sort((a, b) => b.createdAt - a.createdAt));
        setUsers(DB.get("bp_users"));
        setComments(DB.get("bp_comments"));
      };

      const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 2500); };

      useEffect(() => {
        const handler = (e) => { if (dropRef.current && !dropRef.current.contains(e.target)) setDropdownOpen(false); };
        document.addEventListener("mousedown", handler);
        return () => document.removeEventListener("mousedown", handler);
      }, []);

      const navigate = (p, data = null) => {
        if (p === "post") setSelectedPost(data);
        if (p === "edit") setEditingPost(data);
        if (p === "home") { setSelectedPost(null); setEditingPost(null); refresh(); }
        setDropdownOpen(false);
        setPage(p);
        window.scrollTo(0, 0);
      };

      const logout = () => {
        localStorage.removeItem("bp_session");
        setCurrentUser(null);
        navigate("home");
        showToast("Logged out");
      };

      const getUserById = (id) => users.find(u => u.id === id);
      const getPostComments = (postId) => comments.filter(c => c.postId === postId).sort((a, b) => a.createdAt - b.createdAt);

      const filteredPosts = filterTag === "All" ? posts : posts.filter(p => p.tag === filterTag);

      return (
        <>
          <style>{css}</style>
          <nav className="nav">
            <button className="nav-logo" onClick={() => navigate("home")}>Folio<span>.</span></button>
            <div className="nav-actions">
              {currentUser ? (
                <>
                  <button className="btn btn-primary" onClick={() => navigate("write")}>+ Write</button>
                  <div className="dropdown" ref={dropRef}>
                    <button style={{ display: "flex", alignItems: "center", gap: 8 }} onClick={() => setDropdownOpen(o => !o)}>
                      <div className="avatar">{currentUser.avatar}</div>
                    </button>
                    {dropdownOpen && (
                      <div className="dropdown-menu">
                        <button className="dropdown-item" onClick={() => navigate("profile")}>{currentUser.username}</button>
                        <div className="dropdown-divider" />
                        <button className="dropdown-item btn-danger" onClick={logout}>Sign out</button>
                      </div>
                    )}
                  </div>
                </>
              ) : (
                <>
                  <button className="btn btn-ghost" onClick={() => navigate("login")}>Sign in</button>
                  <button className="btn btn-primary" onClick={() => navigate("register")}>Get started</button>
                </>
              )}
            </div>
          </nav>

          {page === "home" && <HomePage posts={filteredPosts} allTags={TAGS} filterTag={filterTag} setFilterTag={setFilterTag} onPost={(p) => navigate("post", p)} users={users} comments={comments} currentUser={currentUser} onLogin={() => navigate("login")} />}
          {page === "login" && <LoginPage users={users} setCurrentUser={setCurrentUser} onDone={() => navigate("home")} onSwitch={() => navigate("register")} showToast={showToast} />}
          {page === "register" && <RegisterPage users={users} setUsers={setUsers} setCurrentUser={setCurrentUser} onDone={() => navigate("home")} onSwitch={() => navigate("login")} showToast={showToast} />}
          {page === "post" && selectedPost && <PostDetail post={posts.find(p => p.id === selectedPost.id) || selectedPost} author={getUserById(selectedPost.authorId)} comments={getPostComments(selectedPost.id)} users={users} currentUser={currentUser} onBack={() => navigate("home")} onEdit={() => navigate("edit", posts.find(p => p.id === selectedPost.id) || selectedPost)} onDelete={() => { const updated = DB.get("bp_posts").filter(p => p.id !== selectedPost.id); DB.set("bp_posts", updated); showToast("Post deleted"); navigate("home"); }} refresh={refresh} setPosts={setPosts} setComments={setComments} showToast={showToast} onLogin={() => navigate("login")} />}
          {page === "write" && currentUser && <WritePost currentUser={currentUser} onSave={(post) => { const all = DB.get("bp_posts"); DB.set("bp_posts", [post, ...all]); refresh(); showToast("Post published!"); navigate("post", post); }} onCancel={() => navigate("home")} />}
          {page === "edit" && editingPost && <EditPost post={editingPost} onSave={(updated) => { const all = DB.get("bp_posts").map(p => p.id === updated.id ? updated : p); DB.set("bp_posts", all); refresh(); showToast("Post updated!"); navigate("post", updated); }} onCancel={() => navigate("post", editingPost)} />}
          {page === "profile" && currentUser && <ProfilePage user={currentUser} posts={posts.filter(p => p.authorId === currentUser.id)} comments={comments.filter(c => c.authorId === currentUser.id)} onPost={(p) => navigate("post", p)} onWrite={() => navigate("write")} />}
          {toast && <div className="toast">{toast}</div>}
        </>
      );
    }

    function HomePage({ posts, allTags, filterTag, setFilterTag, onPost, users, comments, currentUser, onLogin }) {
      const getUser = (id) => users.find(u => u.id === id);
      return (
        <div>
          {!currentUser && (
            <div className="hero">
              <h1>Ideas worth reading,<br /><em>stories worth writing.</em></h1>
              <p>A space for writers and readers. Share your thoughts, explore ideas, and join the conversation.</p>
              <div className="hero-cta">
                <button className="btn btn-primary" style={{ padding: "12px 28px", fontSize: 15 }} onClick={onLogin}>Start writing</button>
              </div>
            </div>
          )}
          <div className="container" style={{ paddingTop: currentUser ? "2.5rem" : 0 }}>
            {currentUser && <h2 style={{ fontFamily: "var(--serif)", fontSize: "1.4rem", fontWeight: 600, marginBottom: "1.5rem" }}>Latest stories</h2>}
            <div className="tags-row">
              {["All", ...allTags].map(t => (
                <button key={t} className={`filter-tag${filterTag === t ? " active" : ""}`} onClick={() => setFilterTag(t)}>{t}</button>
              ))}
            </div>
            {posts.length === 0 ? (
              <div className="empty"><div className="empty-icon">✦</div><p>No posts yet. Be the first to write!</p></div>
            ) : (
              <div className="feed">
                {posts.map(post => {
                  const author = getUser(post.authorId);
                  const postComments = comments.filter(c => c.postId === post.id);
                  return (
                    <div key={post.id} className="post-row" onClick={() => onPost(post)}>
                      <div className="post-row-meta">
                        <div className="avatar" style={{ width: 24, height: 24, fontSize: 10 }}>{author?.avatar || "?"}</div>
                        <span style={{ fontWeight: 500 }}>{author?.username || "Unknown"}</span>
                        <span>·</span>
                        <span>{timeAgo(post.createdAt)}</span>
                        {post.tag && <span className="post-tag">{post.tag}</span>}
                      </div>
                      <h2>{post.title}</h2>
                      <p>{post.excerpt}</p>
                      <div className="post-row-footer">
                        <div className="post-stats">
                          <span className="post-stat">♥ {post.likes?.length || 0}</span>
                          <span className="post-stat">✦ {postComments.length}</span>
                        </div>
                        <span style={{ fontSize: 13, color: "var(--ink3)" }}>Read →</span>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        </div>
      );
    }

    function PostDetail({ post, author, comments, users, currentUser, onBack, onEdit, onDelete, refresh, setPosts, setComments, showToast, onLogin }) {
      const [newComment, setNewComment] = useState("");
      const isOwner = currentUser?.id === post.authorId;
      const hasLiked = post.likes?.includes(currentUser?.id);

      const getUser = (id) => users.find(u => u.id === id);

      const toggleLike = () => {
        if (!currentUser) { onLogin(); return; }
        const all = DB.get("bp_posts");
        const updated = all.map(p => {
          if (p.id !== post.id) return p;
          const likes = p.likes || [];
          return { ...p, likes: likes.includes(currentUser.id) ? likes.filter(l => l !== currentUser.id) : [...likes, currentUser.id] };
        });
        DB.set("bp_posts", updated);
        setPosts(updated.sort((a, b) => b.createdAt - a.createdAt));
      };

      const submitComment = () => {
        if (!newComment.trim()) return;
        if (!currentUser) { onLogin(); return; }
        const comment = { id: genId(), postId: post.id, authorId: currentUser.id, body: newComment.trim(), createdAt: Date.now() };
        const all = DB.get("bp_comments");
        DB.set("bp_comments", [...all, comment]);
        setComments(DB.get("bp_comments"));
        setNewComment("");
        showToast("Comment posted");
      };

      const deleteComment = (id) => {
        const updated = DB.get("bp_comments").filter(c => c.id !== id);
        DB.set("bp_comments", updated);
        setComments(updated);
        showToast("Comment deleted");
      };

      return (
        <div className="post-detail">
          <button className="back-btn" onClick={onBack}>← Back</button>
          {post.tag && <div className="post-detail-tag">{post.tag}</div>}
          <h1>{post.title}</h1>
          <div className="post-detail-byline">
            <div className="avatar">{author?.avatar || "?"}</div>
            <div>
              <strong>{author?.username || "Unknown"}</strong>
              <div><span>{timeAgo(post.createdAt)}</span></div>
            </div>
            {isOwner && (
              <div className="edit-delete">
                <button className="btn btn-outline" style={{ padding: "6px 14px", fontSize: 13 }} onClick={onEdit}>Edit</button>
                <button className="btn btn-danger btn-outline" style={{ padding: "6px 14px", fontSize: 13 }} onClick={() => { if (window.confirm("Delete this post?")) onDelete(); }}>Delete</button>
              </div>
            )}
          </div>
          <div className="post-body">{post.body}</div>
          <div className="post-actions">
            <button className={`like-btn${hasLiked ? " liked" : ""}`} onClick={toggleLike}>
              {hasLiked ? "♥" : "♡"} {post.likes?.length || 0} {post.likes?.length === 1 ? "like" : "likes"}
            </button>
          </div>
          <div className="comments">
            <h3>{comments.length} {comments.length === 1 ? "comment" : "comments"}</h3>
            {comments.length === 0 && <p style={{ color: "var(--ink3)", fontSize: 14 }}>No comments yet. Start the conversation.</p>}
            {comments.map(c => {
              const cAuthor = getUser(c.authorId);
              const canDelete = currentUser?.id === c.authorId || currentUser?.id === post.authorId;
              return (
                <div key={c.id} className="comment">
                  <div className="comment-header">
                    <div className="avatar" style={{ width: 28, height: 28, fontSize: 11 }}>{cAuthor?.avatar || "?"}</div>
                    <span className="comment-author">{cAuthor?.username || "Unknown"}</span>
                    <span className="comment-time">{timeAgo(c.createdAt)}</span>
                    {canDelete && <button className="btn btn-danger" style={{ marginLeft: "auto", padding: "2px 8px", fontSize: 12 }} onClick={() => deleteComment(c.id)}>Delete</button>}
                  </div>
                  <p className="comment-body">{c.body}</p>
                </div>
              );
            })}
            <div className="comment-form">
              {currentUser ? (
                <>
                  <textarea className="textarea" placeholder="Share your thoughts…" value={newComment} onChange={e => setNewComment(e.target.value)} />
                  <div style={{ marginTop: 10 }}>
                    <button className="btn btn-primary" onClick={submitComment} disabled={!newComment.trim()}>Post comment</button>
                  </div>
                </>
              ) : (
                <p style={{ fontSize: 14, color: "var(--ink3)" }}>
                  <button className="btn btn-ghost" style={{ padding: 0, color: "var(--accent)", fontWeight: 500, fontSize: 14 }} onClick={onLogin}>Sign in</button> to leave a comment.
                </p>
              )}
            </div>
          </div>
        </div>
      );
    }

    function WritePost({ currentUser, onSave, onCancel }) {
      const [title, setTitle] = useState("");
      const [body, setBody] = useState("");
      const [tag, setTag] = useState(TAGS[0]);
      const [excerpt, setExcerpt] = useState("");
      const [error, setError] = useState("");

      const handleSave = () => {
        if (!title.trim() || !body.trim()) { setError("Title and body are required."); return; }
        const post = {
          id: genId(), authorId: currentUser.id, title: title.trim(),
          slug: slugify(title), excerpt: excerpt.trim() || body.trim().slice(0, 120) + "…",
          body: body.trim(), tag, createdAt: Date.now(), likes: [],
        };
        onSave(post);
      };

      return (
        <div className="editor-page">
          <h2>New story</h2>
          <input className="title-input" placeholder="Title" value={title} onChange={e => setTitle(e.target.value)} />
          <div className="form-group">
            <label className="form-label">Excerpt (optional — auto-generated if blank)</label>
            <input className="form-input" placeholder="A brief summary…" value={excerpt} onChange={e => setExcerpt(e.target.value)} />
          </div>
          <div className="form-group" style={{ marginBottom: "1rem" }}>
            <label className="form-label">Tag</label>
            <select className="form-select" value={tag} onChange={e => setTag(e.target.value)}>
              {TAGS.map(t => <option key={t}>{t}</option>)}
            </select>
          </div>
          <textarea className="body-input" placeholder="Write your story here…" value={body} onChange={e => setBody(e.target.value)} />
          {error && <div className="form-error">{error}</div>}
          <div className="editor-footer">
            <button className="btn btn-ghost" onClick={onCancel}>Cancel</button>
            <button className="btn btn-primary" onClick={handleSave}>Publish →</button>
          </div>
        </div>
      );
    }

    function EditPost({ post, onSave, onCancel }) {
      const [title, setTitle] = useState(post.title);
      const [body, setBody] = useState(post.body);
      const [tag, setTag] = useState(post.tag || TAGS[0]);
      const [excerpt, setExcerpt] = useState(post.excerpt || "");
      const [error, setError] = useState("");

      const handleSave = () => {
        if (!title.trim() || !body.trim()) { setError("Title and body are required."); return; }
        onSave({ ...post, title: title.trim(), slug: slugify(title), body: body.trim(), tag, excerpt: excerpt.trim() || body.trim().slice(0, 120) + "…" });
      };

      return (
        <div className="editor-page">
          <button className="back-btn" onClick={onCancel}>← Cancel</button>
          <h2>Edit story</h2>
          <input className="title-input" placeholder="Title" value={title} onChange={e => setTitle(e.target.value)} />
          <div className="form-group">
            <label className="form-label">Excerpt</label>
            <input className="form-input" placeholder="A brief summary…" value={excerpt} onChange={e => setExcerpt(e.target.value)} />
          </div>
          <div className="form-group" style={{ marginBottom: "1rem" }}>
            <label className="form-label">Tag</label>
            <select className="form-select" value={tag} onChange={e => setTag(e.target.value)}>
              {TAGS.map(t => <option key={t}>{t}</option>)}
            </select>
          </div>
          <textarea className="body-input" value={body} onChange={e => setBody(e.target.value)} />
          {error && <div className="form-error">{error}</div>}
          <div className="editor-footer">
            <button className="btn btn-ghost" onClick={onCancel}>Cancel</button>
            <button className="btn btn-primary" onClick={handleSave}>Save changes →</button>
          </div>
        </div>
      );
    }

    function LoginPage({ users, setCurrentUser, onDone, onSwitch, showToast }) {
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [error, setError] = useState("");

      const handleLogin = () => {
        const user = users.find(u => u.email === email && u.password === password);
        if (!user) { setError("Invalid email or password."); return; }
        DB.set("bp_session", user);
        setCurrentUser(user);
        showToast(`Welcome back, ${user.username}!`);
        onDone();
      };

      return (
        <div className="form-page">
          <h1 className="form-title">Welcome back.</h1>
          <p className="form-sub">Sign in to continue writing and reading.</p>
          <div className="form-group">
            <label className="form-label">Email</label>
            <input className="form-input" type="email" placeholder="you@example.com" value={email} onChange={e => setEmail(e.target.value)} />
          </div>
          <div className="form-group">
            <label className="form-label">Password</label>
            <input className="form-input" type="password" placeholder="••••••••" value={password} onChange={e => setPassword(e.target.value)} onKeyDown={e => e.key === "Enter" && handleLogin()} />
          </div>
          {error && <div className="form-error">{error}</div>}
          <button className="btn btn-primary" style={{ width: "100%", padding: "12px", fontSize: 15, marginTop: 8 }} onClick={handleLogin}>Sign in →</button>
          <p className="form-switch">Don't have an account? <button onClick={onSwitch}>Create one</button></p>
          <div style={{ marginTop: "2rem", padding: "1rem", background: "var(--paper2)", borderRadius: 10, fontSize: 13, color: "var(--ink3)" }}>
            <strong style={{ color: "var(--ink2)" }}>Demo account:</strong> alice@blog.com / alice123
          </div>
        </div>
      );
    }

    function RegisterPage({ users, setUsers, setCurrentUser, onDone, onSwitch, showToast }) {
      const [username, setUsername] = useState("");
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [error, setError] = useState("");

      const handleRegister = () => {
        if (!username.trim() || !email.trim() || !password.trim()) { setError("All fields are required."); return; }
        if (password.length < 6) { setError("Password must be at least 6 characters."); return; }
        const existing = DB.get("bp_users");
        if (existing.find(u => u.email === email)) { setError("Email already in use."); return; }
        if (existing.find(u => u.username === username)) { setError("Username already taken."); return; }
        const user = { id: genId(), username: username.trim(), email: email.trim(), password, bio: "", avatar: username.trim().slice(0, 2).toUpperCase(), joined: Date.now() };
        const updated = [...existing, user];
        DB.set("bp_users", updated);
        setUsers(updated);
        DB.set("bp_session", user);
        setCurrentUser(user);
        showToast(`Welcome, ${user.username}!`);
        onDone();
      };

      return (
        <div className="form-page">
          <h1 className="form-title">Create your account.</h1>
          <p className="form-sub">Join and start publishing your stories today.</p>
          <div className="form-group">
            <label className="form-label">Username</label>
            <input className="form-input" placeholder="yourname" value={username} onChange={e => setUsername(e.target.value)} />
          </div>
          <div className="form-group">
            <label className="form-label">Email</label>
            <input className="form-input" type="email" placeholder="you@example.com" value={email} onChange={e => setEmail(e.target.value)} />
          </div>
          <div className="form-group">
            <label className="form-label">Password</label>
            <input className="form-input" type="password" placeholder="Min. 6 characters" value={password} onChange={e => setPassword(e.target.value)} onKeyDown={e => e.key === "Enter" && handleRegister()} />
          </div>
          {error && <div className="form-error">{error}</div>}
          <button className="btn btn-primary" style={{ width: "100%", padding: "12px", fontSize: 15, marginTop: 8 }} onClick={handleRegister}>Create account →</button>
          <p className="form-switch">Already have an account? <button onClick={onSwitch}>Sign in</button></p>
        </div>
      );
    }

    function ProfilePage({ user, posts, comments, onPost, onWrite }) {
      return (
        <div className="profile-page">
          <div className="profile-header">
            <div className="profile-avatar">{user.avatar}</div>
            <div>
              <div className="profile-name">{user.username}</div>
              {user.bio && <div className="profile-bio">{user.bio}</div>}
              <div className="profile-joined">Member since {new Date(user.joined).toLocaleDateString("en-US", { month: "long", year: "numeric" })}</div>
            </div>
          </div>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: "1.25rem" }}>
            <h3 className="section-title" style={{ margin: 0 }}>Your posts ({posts.length})</h3>
            <button className="btn btn-primary" onClick={onWrite}>+ Write new</button>
          </div>
          {posts.length === 0 ? (
            <div className="empty"><div className="empty-icon">✦</div><p>You haven't written anything yet.</p></div>
          ) : (
            <div className="feed">
              {posts.map(post => (
                <div key={post.id} className="post-row" onClick={() => onPost(post)}>
                  <div className="post-row-meta">
                    {post.tag && <span className="post-tag">{post.tag}</span>}
                    <span style={{ fontSize: 13, color: "var(--ink3)" }}>{timeAgo(post.createdAt)}</span>
                  </div>
                  <h2>{post.title}</h2>
                  <p>{post.excerpt}</p>
                  <div className="post-stats">
                    <span className="post-stat">♥ {post.likes?.length || 0}</span>
                  </div>
                </div>
              ))}
            </div>
          )}
          {comments.length > 0 && (
            <div style={{ marginTop: "3rem" }}>
              <h3 className="section-title">Your comments ({comments.length})</h3>
              {comments.slice(0, 5).map(c => (
                <div key={c.id} style={{ padding: "1rem 0", borderTop: "1px solid var(--border)" }}>
                  <p style={{ fontSize: 14, color: "var(--ink2)", lineHeight: 1.6 }}>{c.body}</p>
                  <span style={{ fontSize: 12, color: "var(--ink3)" }}>{timeAgo(c.createdAt)}</span>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
